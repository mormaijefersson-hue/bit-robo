<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Bit</title>
<link rel="preconnect" href="https://api.anthropic.com" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --glow: #4ff3ff; --bg: #000; --panel: #0b1116; --txt: #d8f6ff; --mut: #6f8f99; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); overflow: hidden;
    font-family: system-ui, -apple-system, Roboto, sans-serif; user-select: none; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(0,0,0,.55); z-index: 5; text-align: center; padding: 16px; }
  #start h1 { margin: 0; font-size: 22px; font-weight: 600; color: var(--glow); text-shadow: 0 0 12px var(--glow); }
  #start p { margin: 0; color: var(--mut); font-size: 14px; max-width: 420px; }

  #caption { position: fixed; left: 0; right: 0; bottom: 4vh; text-align: center; font-size: 15px; color: var(--mut);
    padding: 0 16px; pointer-events: none; opacity: 0; transition: opacity .4s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #caption.on { opacity: .8; }

  #gear { position: fixed; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #1c3a44;
    background: rgba(10,20,25,.8); color: var(--glow); font-size: 22px; z-index: 4; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #gear.on { opacity: 1; pointer-events: auto; }

  #meter { position: fixed; left: 12px; bottom: 10px; z-index: 3; font-size: 11px; color: var(--mut); display: none; pointer-events: none; }
  #meter.on { display: block; }
  #meter .bar { position: relative; width: 160px; height: 8px; border: 1px solid #1c3a44; border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
  #meter .lvl { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #2a7f8f; }
  #meter .lvl.open { background: var(--glow); }
  #meter .thr { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #ff6b6b; }
  #status { position: fixed; top: 14px; left: 14px; font-size: 12px; color: var(--mut); z-index: 3; opacity: .5; pointer-events: none; }

  #panel { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 10; display: none; overflow-y: auto; padding: 20px 16px 40px; }
  #panel.on { display: block; }
  #panel .box { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  #panel h2 { margin: 0 0 4px; color: var(--glow); font-size: 18px; }
  #panel label { display: grid; gap: 6px; font-size: 14px; color: var(--txt); }
  #panel small { color: var(--mut); font-size: 12px; }
  #panel input, #panel select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1c3a44; background: var(--panel);
    color: var(--txt); font-size: 15px; }
  #panel input[type=checkbox] { width: auto; }
  #panel .row { display: flex; align-items: center; gap: 10px; }
  #panel .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  button.b { padding: 12px 18px; border-radius: 10px; border: 1px solid #1c3a44; background: #0f2a33; color: var(--txt); font-size: 15px; }
  button.b.pri { background: var(--glow); color: #001014; border-color: var(--glow); font-weight: 600; }
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="status"></div>
<div id="caption"></div>
<div id="meter"><div class="bar"><div class="lvl"></div><div class="thr"></div></div><div class="txt"></div></div>
<button id="gear" aria-label="Configurações">⚙</button>

<div id="start">
  <h1>Toque pra acordar o Bit</h1>
  <p>Ele vai pedir o microfone. Depois disso, fica ouvindo sozinho. Toque no rosto pra cutucar; toque enquanto ele fala pra calar a boca dele.</p>
</div>

<div id="panel">
  <div class="box">
    <h2>Configurações</h2>
    <label>Chave da API do Claude
      <input id="cfgKey" type="password" autocomplete="off" placeholder="sk-ant-...">
      <small>Fica salva só neste celular. Sem chave, ele roda no "modo sem cérebro" (respostas prontas).</small>
    </label>
    <label>Nome do robô <input id="cfgName" type="text"></label>
    <label>Gênero
      <select id="cfgFem"><option value="1">Feminino (ela)</option><option value="0">Masculino (ele)</option></select>
    </label>
    <label>Boca suja
      <select id="cfgSwear">
        <option value="liberado">Liberado — fala e aguenta palavrão (sem preconceito)</option>
        <option value="moderado">Moderado — um palavrão leve de vez em quando</option>
        <option value="nao">Desligado — sem palavrão</option>
      </select>
    </label>
    <label>Política
      <select id="cfgPolitica">
        <option value="bolsonarista">Bolsonarista</option>
        <option value="esquerda">Esquerda</option>
        <option value="neutra">Neutra (desconversa)</option>
      </select>
      <small>Opinião e zoeira, sem inventar fato. Na frente de cliente, fica quieta sobre política.</small>
    </label>
    <label>Cérebro
      <select id="cfgModel">
        <option value="claude-haiku-5-5">Haiku (mais rápido — recomendado)</option>
        <option value="claude-sonnet-5-5">Sonnet (mais esperto, um pouco mais lento)</option>
      </select>
    </label>
    <label>Ouvido
      <select id="cfgEar">
        <option value="nuvem">Nuvem — Whisper da Groq (grátis, entende bem, sem bipe — recomendado)</option>
        <option value="vosk">Offline (sem bipe, mas entende mal fala real)</option>
        <option value="google">Google (entende melhor, mas apita e abaixa a voz)</option>
      </select>
    </label>
    <label>Chave da Groq (ouvido na nuvem, grátis)
      <input id="cfgGroq" type="password" autocomplete="off" placeholder="gsk_...">
      <small>Crie grátis em console.groq.com → API Keys. Sem chave, ele usa o ouvido offline.</small>
    </label>
    <label>Sensibilidade do microfone
      <select id="cfgGain">
        <option value="1">Normal</option>
        <option value="2">Alta (2x)</option>
        <option value="4">Muito alta (4x)</option>
        <option value="8">Máxima (8x) — pra falar de longe</option>
      </select>
      <small>Se a barra do medidor não passa do risco vermelho quando você fala normal, suba aqui. Quem precisa gritar deve começar pelo 4x.</small>
    </label>
    <label>Microfone
      <select id="cfgMic">
        <option value="voz">Voz (processado pelo Android — recomendado)</option>
        <option value="bruto">Bruto (sem processamento; no S8 fica quase surdo)</option>
      </select>
    </label>
    <label>Voz <select id="cfgVoice"></select></label>
    <label>Velocidade da fala: <span id="rateVal"></span> <input id="cfgRate" type="range" min="0.8" max="1.6" step="0.05"></label>
    <label>Tom da voz: <span id="pitchVal"></span> <input id="cfgPitch" type="range" min="0.5" max="1.8" step="0.05"></label>
    <label>Cochila depois de (minutos sem ninguém falar) <input id="cfgSleep" type="number" min="1" max="120"></label>
    <label class="row"><input id="cfgNosy" type="checkbox"> Intrometido: comenta tudo que ouvir (desligado = só responde quando chamarem pelo nome)</label>
    <label class="row"><input id="cfgFiller" type="checkbox"> Interjeições enquanto pensa ("hum…", "pera aí…")</label>
    <label class="row"><input id="cfgSpont" type="checkbox"> Puxa assunto sozinho de vez em quando</label>
    <label class="row"><input id="cfgCaption" type="checkbox"> Mostrar legenda do que ouviu</label>
    <label class="row"><input id="cfgMeter" type="checkbox"> Mostrar medidor do microfone (pra ajustar o ouvido)</label>
    <div class="btns">
      <button class="b pri" id="cfgSave">Salvar</button>
      <button class="b" id="cfgTest">Testar voz</button>
      <button class="b" id="cfgForget">Esquecer conversa</button>
      <button class="b" id="cfgClose">Fechar</button>
    </div>
  </div>
</div>

<script src="bit.js"></script>
</body>
</html>
